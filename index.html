<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>대휴 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
.bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f172a 0%,#1e293b 50%,#312e81 100%);padding:20px}
.card{background:#fff;border-radius:24px;padding:40px 28px 32px;width:100%;max-width:400px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.3)}
.logo{width:68px;height:68px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(99,102,241,0.3);font-size:30px}
.app-title{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px}
.app-sub{font-size:14px;color:#94a3b8;margin-bottom:28px}
.field{text-align:left;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:8px}
.text-input{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;font-weight:600;outline:none;font-family:inherit}
.text-input:focus{border-color:#6366f1}
.sheet-row{display:flex;gap:8px;flex-wrap:wrap}
.sheet-chip{padding:10px 18px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:#f1f5f9;color:#475569}
.sheet-chip.active{background:#6366f1;color:#fff}
.btn-primary{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn-primary:disabled{opacity:0.4}
.error-box{background:#fef2f2;color:#dc2626;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px}

.dash{min-height:100vh;background:#f8fafc;padding-bottom:20px}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:10px}
.back-btn{background:none;border:none;font-size:18px;color:#6366f1;cursor:pointer;padding:4px 8px;font-weight:700;font-family:inherit}
.h-name{font-size:17px;font-weight:700}
.h-id{font-size:11px;color:#94a3b8;margin-left:6px}

.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 20px;background:#fff}
.month-arrow{width:36px;height:36px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#475569;font-family:inherit}
.month-label{font-size:18px;font-weight:800;color:#1e293b}
.this-badge{font-size:10px;background:#dbeafe;color:#3b82f6;padding:2px 8px;border-radius:6px;font-weight:700;margin-left:8px}

.sum-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid #f1f5f9}
.sum-item{padding:10px 8px;background:#f8fafc;border-radius:10px;text-align:center}
.sum-num{font-size:20px;font-weight:800}
.sum-label{font-size:11px;color:#94a3b8;font-weight:600;margin-top:2px}
.refresh-btn{background:none;border:1px solid #e2e8f0;border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer;font-family:inherit}

.cal-header{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 8px 0;text-align:center}
.cal-header span{font-size:12px;font-weight:700;padding:6px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:4px 8px 12px}
.cal-day{border-radius:12px;padding:6px 2px;text-align:center;cursor:pointer;min-height:56px;border:1px solid transparent;background:#fff;transition:all 0.15s}
.cal-day:hover{border-color:#e2e8f0}
.cal-day.today{border:2px solid #3b82f6}
.cal-day.has-leave{background:#dcfce7;border-color:#86efac}
.cal-day.other-month{opacity:0.3;pointer-events:none}
.cal-day .d-num{font-size:14px;font-weight:700;display:block}
.cal-day .d-hours{font-size:11px;font-weight:700;color:#16a34a;display:block;margin-top:2px}
.cal-day.empty{cursor:default;pointer-events:none}

.notice-banner{margin:8px 12px 0;padding:14px 18px;border-radius:12px;background:linear-gradient(135deg,#fef3c7,#fef9c3);border:1px solid #fde68a;font-size:13px;font-weight:600;color:#92400e;line-height:1.6;white-space:pre-wrap}
.notice-banner::before{content:"📢 "}

.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn 0.2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;padding:12px 24px 32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:slideUp 0.3s ease-out}
.modal-handle{width:40px;height:4px;border-radius:2px;background:#d1d5db;margin:0 auto 16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.modal-title{font-size:18px;font-weight:700}
.close-btn{background:#f1f5f9;border:none;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;color:#64748b}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{width:44px;height:44px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;background:#f1f5f9;color:#475569}
.chip.active{background:#22c55e;color:#fff}
.hour-row{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.hour-input{flex:1;padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:18px;font-weight:700;outline:none;text-align:center;font-family:inherit}
.hour-input:focus{border-color:#22c55e}
.hour-unit{font-size:14px;color:#64748b;font-weight:600}
.submit-msg{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:center}
.submit-msg.ok{background:#f0fdf4;color:#166534}
.submit-msg.err{background:#fef2f2;color:#991b1b}
.btn-leave{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-leave:disabled{opacity:0.4}
.btn-delete{width:100%;padding:12px;border:1px solid #fecaca;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;background:#fff;color:#ef4444;margin-top:10px}

.hidden{display:none !important}
.connecting{color:#94a3b8;font-size:14px;padding:10px 0}
</style>
</head>
<body>

<div id="homeScreen" class="bg"><div class="card">
  <h1 class="app-title">대휴 관리 시스템</h1>
  <p id="connectingMsg" class="connecting">연결 중...</p>
  <div id="sheetField" class="field hidden">
    <label>월 선택</label>
    <div id="sheetRow" class="sheet-row"></div>
  </div>
  <div id="empFields" class="hidden">
    <div class="field"><label>사번</label><input id="empIdInput" class="text-input" type="number" inputmode="numeric" placeholder="예: 123456"></div>
    <div class="field"><label>이름</label><input id="empNameInput" class="text-input" type="text" placeholder="예: 홍길동"></div>
  </div>
  <div id="homeError" class="error-box hidden"></div>
  <button id="enterBtn" class="btn-primary hidden" onclick="handleEnter()">입장하기</button>
</div></div>

<div id="dashScreen" class="dash hidden">
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="goHome()">←</button>
      <div><span id="dashName" class="h-name"></span><span id="dashId" class="h-id"></span></div>
    </div>
    <button class="refresh-btn" onclick="refreshData()">❗새로고침❗🔄</button>
  </div>
  <div id="sumRow" class="sum-row"></div>
  <div class="month-nav">
    <button class="month-arrow" onclick="changeMonth(-1)">‹</button>
    <div><span id="monthLabel" class="month-label"></span><span id="thisBadge" class="this-badge hidden">이번달</span></div>
    <button class="month-arrow" onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-header"><span style="color:#ef4444">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span style="color:#3b82f6">토</span></div>
  <div id="calGrid" class="cal-grid"></div>
  <div id="noticeBanner" class="notice-banner hidden"></div>
</div>

<div id="modal" class="overlay hidden" onclick="closeModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <h3 id="modalTitle" class="modal-title"></h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <label style="font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:10px">대휴시간(원하는 시간 입력 가능)</label>
    <div class="chip-row" id="chipRow"></div>
    <div class="hour-row">
      <input id="hourInput" class="hour-input" type="number" inputmode="decimal" step="0.5" placeholder="직접 입력">
      <span class="hour-unit">시간</span>
    </div>
    <div id="submitMsg" class="submit-msg hidden"></div>
    <button id="submitBtn" class="btn-leave" onclick="handleSubmit()">대휴시간 등록</button>
    <button id="deleteBtn" class="btn-delete hidden" onclick="handleDelete()">등록 취소</button>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  ↓↓↓ 아래 URL만 수정하세요 (따옴표 안에 붙여넣기) ↓↓↓      ║
// ╚══════════════════════════════════════════════════════════════╝
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwl4ndyWgjfAjwgV6Qql39mx2OZo_mk-q8Ekpg_hIA6GmmwXVFVuaqk4-K-LTGJ4Fz5g/exec";


var DAY_KR=["일","월","화","수","목","금","토"];
var state={sheets:[],selectedSheet:"",empId:"",empName:"",empData:null,currentMonth:new Date(),selectedDate:null,hours:"8"};

function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function api(params){
  var u=new URL(SCRIPT_URL);
  Object.entries(params).forEach(function(kv){u.searchParams.set(kv[0],kv[1]);});
  return fetch(u.toString(),{redirect:"follow"}).then(function(r){if(!r.ok)throw new Error("서버 오류");return r.json();});
}
function $(id){return document.getElementById(id);}
function show(id){$(id).classList.remove("hidden");}
function hide(id){$(id).classList.add("hidden");}

window.addEventListener("DOMContentLoaded",function(){
  if(!SCRIPT_URL||SCRIPT_URL==="여기에_URL_붙여넣기"){$("connectingMsg").textContent="코드 내 SCRIPT_URL을 설정해주세요";return;}
  $("empIdInput").addEventListener("input",checkBtn);
  $("empNameInput").addEventListener("input",checkBtn);
  $("empNameInput").addEventListener("keydown",function(e){if(e.key==="Enter")handleEnter();});
  $("hourInput").addEventListener("input",function(){state.hours=$("hourInput").value;updateChips();});

  api({action:"getSheets"}).then(function(d){
    if(d.success){state.sheets=d.sheets;hide("connectingMsg");renderSheets();if(d.sheets.length===1){state.selectedSheet=d.sheets[0];renderSheets();show("empFields");}}
    else{$("connectingMsg").textContent="서버 오류: "+(d.error||"");}
  }).catch(function(){$("connectingMsg").textContent="서버 연결 실패";});
});

function renderSheets(){
  if(!state.sheets.length)return;show("sheetField");
  $("sheetRow").innerHTML=state.sheets.map(function(s){return '<button class="sheet-chip '+(state.selectedSheet===s?"active":"")+'" onclick="selectSheet(\''+s+'\')">'+s+'</button>';}).join("");
}
function selectSheet(n){state.selectedSheet=n;renderSheets();show("empFields");checkBtn();}
function checkBtn(){state.empId=$("empIdInput").value.trim();state.empName=$("empNameInput").value.trim();if(state.empId&&state.empName&&state.selectedSheet)show("enterBtn");else hide("enterBtn");}

function handleEnter(){
  if(!state.empId||!state.empName||!state.selectedSheet)return;
  $("enterBtn").disabled=true;$("enterBtn").textContent="조회 중...";hide("homeError");
  api({action:"enter",sheet:state.selectedSheet,empId:state.empId,name:state.empName}).then(function(d){
    if(d.success){state.empData=d;hide("homeScreen");show("dashScreen");renderDash();}
    else{$("homeError").textContent=d.error||"오류";show("homeError");}
  }).catch(function(){$("homeError").textContent="서버 연결 실패";show("homeError");})
  .finally(function(){$("enterBtn").disabled=false;$("enterBtn").textContent="입장하기";});
}
function goHome(){state.empData=null;hide("dashScreen");show("homeScreen");}

function renderDash(){
  var ed=state.empData;if(!ed)return;
  $("dashName").textContent=ed.name;
  $("dashId").textContent=ed.empId;
  if(ed.notice){$("noticeBanner").textContent=ed.notice;show("noticeBanner");}else{hide("noticeBanner");}
  renderMonth();
}

function changeMonth(dir){
  var d=state.currentMonth;
  state.currentMonth=new Date(d.getFullYear(),d.getMonth()+dir,1);
  renderMonth();
}

function renderMonth(){
  var cm=state.currentMonth;
  var y=cm.getFullYear(),m=cm.getMonth();
  var today=new Date(),todayStr=fmt(today);
  var isThisMonth=today.getFullYear()===y&&today.getMonth()===m;

  $("monthLabel").textContent=y+"년 "+(m+1)+"월";
  if(isThisMonth)show("thisBadge");else hide("thisBadge");

  // 월간 요약
  var usedThisMonth=0;
  if(state.empData&&state.empData.entries){
    state.empData.entries.forEach(function(e){
      var ed=new Date(e.date);
      if(ed.getFullYear()===y&&ed.getMonth()===m&&e.hours>0){usedThisMonth+=e.hours;}
    });
  }
  var past=state.empData?state.empData.pastHours||0:0;
  var remain=state.empData?state.empData.remaining||0:0;
  $("sumRow").innerHTML=[
    {n:past+"h",l:"적치",c:"#64748b"},
    {n:usedThisMonth.toFixed(1)+"h",l:"사용시간",c:"#f59e0b"},
    {n:remain.toFixed(1)+"h",l:"잔여",c:"#6366f1"},
  ].map(function(s){return '<div class="sum-item" style="border-left:3px solid '+s.c+'"><div class="sum-num">'+s.n+'</div><div class="sum-label">'+s.l+'</div></div>';}).join("");

  // 달력 생성
  var firstDay=new Date(y,m,1).getDay();
  var lastDate=new Date(y,m+1,0).getDate();
  var html="";

  // 빈칸
  for(var i=0;i<firstDay;i++) html+='<div class="cal-day empty"></div>';

  for(var d=1;d<=lastDate;d++){
    var ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var entry=getEntry(ds);
    var hasLeave=entry&&entry.hours>0;
    var isToday=todayStr===ds;
    var isSun=new Date(y,m,d).getDay()===0;
    var isSat=new Date(y,m,d).getDay()===6;
    var numColor=isSun?"#ef4444":isSat?"#3b82f6":"#1e293b";

    html+='<div class="cal-day'+(isToday?" today":"")+(hasLeave?" has-leave":"")+'" onclick="openModal(\''+ds+'\')">';
    html+='<span class="d-num" style="color:'+numColor+'">'+d+'</span>';
    if(hasLeave) html+='<span class="d-hours">'+entry.hours+'h</span>';
    html+='</div>';
  }
  $("calGrid").innerHTML=html;
}

function getEntry(ds){
  if(!state.empData||!state.empData.entries)return null;
  return state.empData.entries.find(function(e){return e.date===ds;})||null;
}

function openModal(ds){
  state.selectedDate=ds;
  var parts=ds.split("-");
  var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  $("modalTitle").textContent=(d.getMonth()+1)+"/"+d.getDate()+"("+DAY_KR[d.getDay()]+") 대휴시간 등록";
  var entry=getEntry(ds);
  state.hours=entry&&entry.hours>0?String(entry.hours):"8";
  $("hourInput").value=state.hours;
  updateChips();
  hide("submitMsg");
  if(entry&&entry.hours>0)show("deleteBtn");else hide("deleteBtn");
  show("modal");
}
function closeModal(){hide("modal");}

function updateChips(){
  $("chipRow").innerHTML=[4,6,7,8].map(function(h){
    return '<button class="chip'+(state.hours===String(h)?" active":"")+'" onclick="pickHour('+h+')">'+h+'</button>';
  }).join("");
}
function pickHour(h){state.hours=String(h);$("hourInput").value=h;updateChips();}

function handleSubmit(){
  if(!state.selectedDate||!state.hours)return;
  // 잔여 초과 체크
  var h=parseFloat(state.hours)||0;
  var currentEntry=getEntry(state.selectedDate);
  var currentHours=(currentEntry&&currentEntry.hours>0)?currentEntry.hours:0;
  var newRemaining=(state.empData.remaining||0)+currentHours-h;
  if(newRemaining<0){
    var msg=$("submitMsg");
    msg.className="submit-msg err";
    msg.textContent="잔여시간이 부족합니다. 사용 가능 시간: "+(state.empData.remaining+currentHours).toFixed(1)+"h";
    show("submitMsg");
    return;
  }
  $("submitBtn").disabled=true;$("submitBtn").textContent="저장 중...";hide("submitMsg");
  api({action:"submitEntry",sheet:state.selectedSheet,empId:state.empData.empId,date:state.selectedDate,hours:state.hours}).then(function(d){
    var msg=$("submitMsg");
    if(d.success){msg.className="submit-msg ok";msg.textContent="✓ 등록완료 | 잔여: "+d.remaining.toFixed(1)+"h";show("submitMsg");refreshData();setTimeout(closeModal,1500);}
    else{msg.className="submit-msg err";msg.textContent="⚠ "+(d.error||"저장 실패");show("submitMsg");}
  }).catch(function(){var msg=$("submitMsg");msg.className="submit-msg err";msg.textContent="⚠ 서버 연결 실패";show("submitMsg");})
  .finally(function(){$("submitBtn").disabled=false;$("submitBtn").textContent="대휴시간 등록";});
}

function handleDelete(){
  if(!state.selectedDate)return;
  $("deleteBtn").disabled=true;$("deleteBtn").textContent="삭제 중...";
  api({action:"deleteEntry",sheet:state.selectedSheet,empId:state.empData.empId,date:state.selectedDate}).then(function(d){
    if(d.success){refreshData();closeModal();}
  }).catch(function(){}).finally(function(){$("deleteBtn").disabled=false;$("deleteBtn").textContent="등록 취소";});
}

function refreshData(){
  if(!state.empData)return;
  api({action:"enter",sheet:state.selectedSheet,empId:state.empData.empId,name:state.empData.name}).then(function(d){if(d.success){state.empData=d;renderDash();}});
}
</script>
</body>
</html>
