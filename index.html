<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>근태관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f8fafc; color:#1e293b; overflow-x:hidden; min-height:100vh;
}
.bg {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#0f172a 0%,#1e293b 50%,#312e81 100%); padding:20px;
}
.card {
  background:#fff; border-radius:24px; padding:40px 28px 32px;
  width:100%; max-width:400px; text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.3);
}
.logo-wrap { margin-bottom:28px; }
.logo {
  width:68px; height:68px; border-radius:18px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:inline-flex; align-items:center; justify-content:center;
  margin-bottom:14px; box-shadow:0 8px 24px rgba(99,102,241,0.3); font-size:30px;
}
.app-title { font-size:26px; font-weight:800; letter-spacing:-0.5px; margin-bottom:4px; }
.app-sub { font-size:14px; color:#94a3b8; }
.field { text-align:left; margin-bottom:16px; }
.field label { font-size:13px; font-weight:600; color:#475569; display:block; margin-bottom:8px; }
.text-input {
  width:100%; padding:14px 16px; border:2px solid #e2e8f0; border-radius:12px;
  font-size:16px; font-weight:600; outline:none; transition:border 0.2s; font-family:inherit;
}
.text-input:focus { border-color:#6366f1; }
.sheet-row { display:flex; gap:8px; flex-wrap:wrap; }
.sheet-chip {
  padding:10px 18px; border-radius:10px; border:none; font-size:14px;
  font-weight:700; cursor:pointer; font-family:inherit; background:#f1f5f9; color:#475569;
}
.sheet-chip.active { background:#6366f1; color:#fff; }
.btn-primary {
  width:100%; padding:16px; border:none; border-radius:14px;
  font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
  background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
}
.btn-primary:disabled { opacity:0.4; }
.error-box {
  background:#fef2f2; color:#dc2626; padding:12px 16px;
  border-radius:10px; font-size:13px; margin-bottom:16px;
}
.dash { min-height:100vh; background:#f8fafc; padding-bottom:80px; }
.header {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 18px; background:#fff; border-bottom:1px solid #e2e8f0;
  position:sticky; top:0; z-index:10;
}
.header-left { display:flex; align-items:center; gap:10px; }
.back-btn {
  background:none; border:none; font-size:18px; color:#6366f1;
  cursor:pointer; padding:4px 8px; font-weight:700; font-family:inherit;
}
.h-name { font-size:17px; font-weight:700; }
.h-id { font-size:11px; color:#94a3b8; margin-left:6px; }
.bal-badge {
  background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:14px;
  padding:8px 16px; display:flex; flex-direction:column; align-items:center;
}
.bal-label { font-size:10px; color:rgba(255,255,255,0.7); font-weight:600; }
.bal-value { font-size:18px; font-weight:800; color:#fff; }
.week-nav {
  display:flex; align-items:center; justify-content:center;
  gap:16px; padding:14px 20px; background:#fff;
}
.week-arrow {
  width:36px; height:36px; border-radius:10px; border:1px solid #e2e8f0;
  background:#fff; font-size:20px; cursor:pointer; display:flex;
  align-items:center; justify-content:center; color:#475569; font-family:inherit;
}
.week-label { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.this-badge {
  font-size:10px; background:#dbeafe; color:#3b82f6;
  padding:2px 8px; border-radius:6px; font-weight:700;
}
.sum-row {
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  padding:0 16px 12px; background:#fff; border-bottom:1px solid #f1f5f9;
}
.sum-item { padding:10px 8px; background:#f8fafc; border-radius:10px; text-align:center; }
.sum-num { font-size:18px; font-weight:800; }
.sum-label { font-size:11px; color:#94a3b8; font-weight:600; margin-top:2px; }
.week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:12px 8px; }
.day-card {
  border-radius:12px; padding:8px 4px; text-align:center;
  cursor:pointer; min-height:90px; border:1px solid #e2e8f0; background:#fff;
}
.day-card.today { border:2px solid #3b82f6; }
.day-name { font-size:11px; font-weight:600; display:block; }
.day-num { font-size:16px; font-weight:800; display:block; }
.day-body { display:flex; flex-direction:column; align-items:center; gap:2px; }
.type-tag { font-size:9px; font-weight:700; padding:2px 5px; border-radius:4px; white-space:nowrap; }
.day-h { font-size:12px; font-weight:700; color:#475569; }
.day-conv { font-size:10px; font-weight:700; }
.day-empty { display:flex; align-items:center; justify-content:center; height:40px; }
.day-plus { font-size:18px; opacity:0.15; }
.overlay {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.5); display:flex;
  align-items:flex-end; justify-content:center; z-index:100;
  animation:fadeIn 0.2s;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-sheet {
  background:#fff; border-radius:24px 24px 0 0; padding:12px 24px 32px;
  width:100%; max-width:480px; max-height:85vh; overflow-y:auto;
  animation:slideUp 0.3s ease-out;
}
.modal-handle { width:40px; height:4px; border-radius:2px; background:#d1d5db; margin:0 auto 16px; }
.modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.modal-title { font-size:18px; font-weight:700; }
.close-btn {
  background:#f1f5f9; border:none; border-radius:8px;
  width:32px; height:32px; font-size:16px; cursor:pointer; color:#64748b;
}
.type-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:24px; }
.type-opt {
  border-radius:14px; padding:14px 10px; text-align:center; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  border:1px solid #e2e8f0; background:#fff; font-family:inherit;
}
.type-opt .icon { font-size:22px; }
.type-opt .name { font-size:14px; font-weight:500; color:#64748b; }
.type-opt .desc { font-size:10px; color:#94a3b8; }
.chip-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.chip {
  width:40px; height:40px; border-radius:10px; border:none;
  font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  background:#f1f5f9; color:#475569;
}
.chip.active { background:#6366f1; color:#fff; }
.hour-row { display:flex; align-items:center; gap:8px; }
.hour-input {
  flex:1; padding:12px 16px; border:2px solid #e2e8f0; border-radius:12px;
  font-size:16px; font-weight:600; outline:none; text-align:center; font-family:inherit;
}
.hour-input:focus { border-color:#6366f1; }
.hour-unit { font-size:14px; color:#64748b; font-weight:600; }
.preview {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 18px; background:#f8fafc; border-radius:12px; margin-bottom:16px;
}
.preview-label { font-size:13px; color:#64748b; font-weight:600; }
.preview-value { font-size:20px; font-weight:800; }
.submit-msg {
  padding:12px 16px; border-radius:10px; font-size:13px; font-weight:600;
  margin-bottom:12px; text-align:center;
}
.submit-msg.ok { background:#f0fdf4; color:#166534; }
.submit-msg.err { background:#fef2f2; color:#991b1b; }
.footer {
  position:fixed; bottom:0; left:0; right:0;
  padding:12px 20px; background:#fff; border-top:1px solid #e2e8f0; text-align:center;
}
.refresh-btn {
  background:none; border:1px solid #e2e8f0; border-radius:10px;
  padding:10px 24px; font-size:14px; color:#475569; cursor:pointer;
  font-weight:600; font-family:inherit;
}
.hidden { display:none !important; }
.connecting { color:#94a3b8; font-size:14px; padding:10px 0; }
</style>
</head>
<body>

<div id="homeScreen" class="bg">
  <div class="card">
    <div class="logo-wrap">
      <div class="logo">📋</div>
      <h1 class="app-title">근태관리</h1>
      <p class="app-sub">연장·휴일근무 대체휴무 관리</p>
    </div>
    <p id="connectingMsg" class="connecting">연결 중...</p>
    <div id="sheetField" class="field hidden">
      <label>월 선택</label>
      <div id="sheetRow" class="sheet-row"></div>
    </div>
    <div id="empFields" class="hidden">
      <div class="field">
        <label>사번</label>
        <input id="empIdInput" class="text-input" type="number" inputmode="numeric" placeholder="예: 121212">
      </div>
      <div class="field">
        <label>이름</label>
        <input id="empNameInput" class="text-input" type="text" placeholder="예: 홍길동">
      </div>
    </div>
    <div id="homeError" class="error-box hidden"></div>
    <button id="enterBtn" class="btn-primary hidden" onclick="handleEnter()">입장하기</button>
  </div>
</div>

<div id="dashScreen" class="dash hidden">
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="goHome()">←</button>
      <div>
        <span id="dashName" class="h-name"></span>
        <span id="dashId" class="h-id"></span>
      </div>
    </div>
    <div class="bal-badge">
      <span class="bal-label">잔여</span>
      <span id="balValue" class="bal-value">0.0h</span>
    </div>
  </div>
  <div class="week-nav">
    <button class="week-arrow" onclick="changeWeek(-1)">‹</button>
    <div class="week-label">
      <span id="weekRange"></span>
      <span id="thisBadge" class="this-badge hidden">이번주</span>
    </div>
    <button class="week-arrow" onclick="changeWeek(1)">›</button>
  </div>
  <div id="sumRow" class="sum-row"></div>
  <div id="weekGrid" class="week-grid"></div>
  <div class="footer">
    <button class="refresh-btn" onclick="refreshData()">🔄 새로고침</button>
  </div>
</div>

<div id="modal" class="overlay hidden" onclick="closeModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <h3 id="modalTitle" class="modal-title"></h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="typeGrid" class="type-grid"></div>
    <div id="hoursSection" class="hidden">
      <label id="hoursLabel" style="font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:10px"></label>
      <div class="chip-row" id="chipRow"></div>
      <div class="hour-row">
        <input id="hourInput" class="hour-input" type="number" inputmode="decimal" step="0.5" placeholder="직접 입력">
        <span class="hour-unit">시간</span>
      </div>
    </div>
    <div id="previewBox" class="preview hidden">
      <span class="preview-label">환산 예상</span>
      <span id="previewValue" class="preview-value"></span>
    </div>
    <div id="submitMsg" class="submit-msg hidden"></div>
    <button id="submitBtn" class="btn-primary" onclick="handleSubmit()">저장하기</button>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  ↓↓↓ 아래 URL만 수정하세요 (따옴표 안에 붙여넣기) ↓↓↓      ║
// ╚══════════════════════════════════════════════════════════════╝
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwl4ndyWgjfAjwgV6Qql39mx2OZo_mk-q8Ekpg_hIA6GmmwXVFVuaqk4-K-LTGJ4Fz5g/exec";


var WORK_TYPES = [
  { value:"정상퇴근", label:"정상퇴근", color:"#64748b", icon:"\uD83C\uDFE0", desc:"기본 근무" },
  { value:"연장근무", label:"연장근무", color:"#f59e0b", icon:"\u23F0", desc:"\u00D71.5 환산" },
  { value:"휴일근무", label:"휴일근무", color:"#ef4444", icon:"\uD83D\uDCC5", desc:"8h+초과\u00D71.5" },
  { value:"대체휴무", label:"대체휴무", color:"#22c55e", icon:"\uD83C\uDF34", desc:"잔여 차감" }
];
var DAY_KR = ["일","월","화","수","목","금","토"];

var state = {
  sheets:[], selectedSheet:"", empId:"", empName:"",
  empData:null, currentWeek:new Date(), selectedDate:null,
  workType:"연장근무", hours:""
};

function fmt(d) {
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function getWeekDates(base) {
  var d=new Date(base), sun=new Date(d);
  sun.setDate(d.getDate()-d.getDay());
  var arr=[];
  for(var i=0;i<7;i++){var dd=new Date(sun);dd.setDate(sun.getDate()+i);arr.push(dd);}
  return arr;
}
function calcConv(type,hours) {
  var h=parseFloat(hours)||0;
  if(type==="연장근무") return h*1.5;
  if(type==="휴일근무") return h>8?8+(h-8)*1.5:h;
  if(type==="대체휴무") return -Math.abs(h);
  return 0;
}

function api(params) {
  var u=new URL(SCRIPT_URL);
  Object.entries(params).forEach(function(kv){u.searchParams.set(kv[0],kv[1]);});
  return fetch(u.toString(), {redirect:"follow"})
    .then(function(r){
      if(!r.ok) throw new Error("서버 오류: "+r.status);
      return r.json();
    });
}

function $(id){return document.getElementById(id);}
function show(id){$(id).classList.remove("hidden");}
function hide(id){$(id).classList.add("hidden");}

window.addEventListener("DOMContentLoaded", function(){
  if(!SCRIPT_URL || SCRIPT_URL==="여기에_URL_붙여넣기"){
    $("connectingMsg").textContent = "코드 내 SCRIPT_URL을 설정해주세요";
    return;
  }
  $("empIdInput").addEventListener("input", checkEnterBtn);
  $("empNameInput").addEventListener("input", checkEnterBtn);
  $("empNameInput").addEventListener("keydown", function(e){if(e.key==="Enter")handleEnter();});
  $("hourInput").addEventListener("input", function(){state.hours=$("hourInput").value;updatePreview();});

  api({action:"getSheets"})
    .then(function(d){
      if(d.success){
        state.sheets=d.sheets;
        hide("connectingMsg");
        renderSheets();
        if(d.sheets.length===1){state.selectedSheet=d.sheets[0];renderSheets();show("empFields");}
      } else {
        $("connectingMsg").textContent = "서버 오류: "+(d.error||"알 수 없음");
      }
    })
    .catch(function(e){
      $("connectingMsg").textContent = "서버 연결 실패 - URL을 확인해주세요";
      console.error("연결 오류:", e);
    });
});

function renderSheets(){
  if(state.sheets.length===0)return;
  show("sheetField");
  $("sheetRow").innerHTML=state.sheets.map(function(s){
    return '<button class="sheet-chip '+(state.selectedSheet===s?"active":"")+'" onclick="selectSheet(\''+s+'\')">'+s+'</button>';
  }).join("");
}
function selectSheet(name){state.selectedSheet=name;renderSheets();show("empFields");checkEnterBtn();}
function checkEnterBtn(){
  state.empId=$("empIdInput").value.trim();
  state.empName=$("empNameInput").value.trim();
  if(state.empId&&state.empName&&state.selectedSheet)show("enterBtn");else hide("enterBtn");
}

function handleEnter(){
  if(!state.empId||!state.empName||!state.selectedSheet)return;
  $("enterBtn").disabled=true;$("enterBtn").textContent="조회 중...";hide("homeError");
  api({action:"enter",sheet:state.selectedSheet,empId:state.empId,name:state.empName})
    .then(function(d){
      if(d.success){state.empData=d;hide("homeScreen");show("dashScreen");renderDash();}
      else{$("homeError").textContent=d.error||"오류 발생";show("homeError");}
    })
    .catch(function(){$("homeError").textContent="서버 연결 실패";show("homeError");})
    .finally(function(){$("enterBtn").disabled=false;$("enterBtn").textContent="입장하기";});
}
function goHome(){state.empData=null;hide("dashScreen");show("homeScreen");}

function renderDash(){
  var ed=state.empData;if(!ed)return;
  $("dashName").textContent=ed.name;
  $("dashId").textContent=ed.empId;
  $("balValue").textContent=(ed.finalBalance||0).toFixed(1)+"h";
  renderWeek();
}
function changeWeek(dir){
  var d=new Date(state.currentWeek);d.setDate(d.getDate()+dir*7);state.currentWeek=d;renderWeek();
}
function renderWeek(){
  var dates=getWeekDates(state.currentWeek);
  var today=new Date(),todayStr=fmt(today);
  $("weekRange").textContent=(dates[0].getMonth()+1)+"/"+dates[0].getDate()+" ~ "+(dates[6].getMonth()+1)+"/"+dates[6].getDate();
  var isThisWeek=fmt(dates[0])<=todayStr&&todayStr<=fmt(dates[6]);
  if(isThisWeek)show("thisBadge");else hide("thisBadge");

  var ot=0,hol=0,co=0,conv=0;
  dates.forEach(function(d){
    var e=getEntry(fmt(d));
    if(e){conv+=e.converted||0;if(e.workType==="연장근무")ot++;if(e.workType==="휴일근무")hol++;if(e.workType==="대체휴무")co++;}
  });
  $("sumRow").innerHTML=[
    {n:ot,l:"연장",c:"#f59e0b"},{n:hol,l:"휴일",c:"#ef4444"},
    {n:co,l:"대휴",c:"#22c55e"},{n:conv.toFixed(1),l:"환산h",c:"#6366f1"}
  ].map(function(s){return '<div class="sum-item" style="border-left:3px solid '+s.c+'"><div class="sum-num">'+s.n+'</div><div class="sum-label">'+s.l+'</div></div>';}).join("");

  $("weekGrid").innerHTML=dates.map(function(d){
    var ds=fmt(d),entry=getEntry(ds),isToday=todayStr===ds;
    var wt=WORK_TYPES.find(function(w){return w.value===(entry&&entry.workType);});
    var isNormal=!entry||entry.workType==="정상퇴근"||entry.converted===0;
    var isSun=d.getDay()===0,isSat=d.getDay()===6;
    var dayColor=isSun?"#ef4444":isSat?"#3b82f6":"#475569";
    var bgColor=isNormal?"#fff":(wt?wt.color:"#fff")+"08";
    var body;
    if(!isNormal&&wt){
      body='<div class="day-body"><span class="type-tag" style="background:'+wt.color+'18;color:'+wt.color+'">'+wt.icon+" "+entry.workType.slice(0,2)+'</span><span class="day-h">'+entry.hours+'h</span><span class="day-conv" style="color:'+(entry.converted>=0?"#6366f1":"#ef4444")+'">'+(entry.converted>=0?"+":"")+entry.converted.toFixed(1)+'</span></div>';
    }else{
      body='<div class="day-empty"><span class="day-plus">+</span></div>';
    }
    return '<div class="day-card '+(isToday?"today":"")+'" style="background:'+bgColor+'" onclick="openModal(\''+ds+'\','+d.getDay()+','+(d.getMonth()+1)+','+d.getDate()+')"><div style="color:'+dayColor+'"><span class="day-name">'+DAY_KR[d.getDay()]+'</span><span class="day-num">'+d.getDate()+'</span></div>'+body+'</div>';
  }).join("");
}
function getEntry(ds){return state.empData&&state.empData.entries?state.empData.entries.find(function(e){return e.date===ds;}):null;}

function openModal(dateStr,dayIdx,month,date){
  state.selectedDate=dateStr;
  $("modalTitle").textContent=month+"/"+date+"("+DAY_KR[dayIdx]+") 근태 입력";
  var entry=getEntry(dateStr);
  var isNormal=!entry||entry.workType==="정상퇴근"||entry.converted===0;
  state.workType=(!isNormal&&entry)?entry.workType:"연장근무";
  state.hours=(!isNormal&&entry)?String(entry.hours||""):"";
  renderModal();show("modal");
}
function closeModal(){hide("modal");hide("submitMsg");}

function selectType(val){
  state.workType=val;
  if(val==="정상퇴근")state.hours="0";
  else if(val==="대체휴무")state.hours="8";
  else state.hours="";
  renderModal();
}
function selectHour(h){state.hours=String(h);renderModal();}

function renderModal(){
  $("typeGrid").innerHTML=WORK_TYPES.map(function(wt){
    var active=state.workType===wt.value;
    return '<button class="type-opt'+(active?" active":"")+'" style="border:'+(active?"2px solid "+wt.color:"1px solid #e2e8f0")+';background:'+(active?wt.color+"10":"#fff")+'" onclick="selectType(\''+wt.value+'\')"><span class="icon">'+wt.icon+'</span><span class="name" style="color:'+(active?wt.color:"#64748b")+'">'+wt.label+'</span><span class="desc">'+wt.desc+'</span></button>';
  }).join("");

  if(state.workType!=="정상퇴근"){
    show("hoursSection");
    $("hoursLabel").textContent=state.workType==="대체휴무"?"사용 시간":"초과근무 시간";
    $("chipRow").innerHTML=[1,2,3,4,5,6,7,8].map(function(h){
      return '<button class="chip'+(state.hours===String(h)?" active":"")+'" onclick="selectHour('+h+')">'+h+'</button>';
    }).join("");
    $("hourInput").value=state.hours;
  }else{hide("hoursSection");}
  updatePreview();
}

function updatePreview(){
  var h=$("hourInput")?$("hourInput").value:state.hours;
  if(h)state.hours=h;
  if(state.hours||state.workType==="정상퇴근"){
    show("previewBox");
    var cv=calcConv(state.workType,state.hours||0);
    $("previewValue").textContent=(cv>=0?"+":"")+cv.toFixed(1)+"h";
    $("previewValue").style.color=cv>=0?"#6366f1":"#ef4444";
    $("submitBtn").disabled=false;$("submitBtn").style.opacity="1";
  }else{
    hide("previewBox");$("submitBtn").disabled=true;$("submitBtn").style.opacity="0.4";
  }
}

function handleSubmit(){
  if(!state.selectedDate)return;
  var hrs=state.workType==="정상퇴근"?"0":state.hours;
  if(!hrs&&state.workType!=="정상퇴근")return;
  $("submitBtn").disabled=true;$("submitBtn").textContent="저장 중...";hide("submitMsg");

  api({action:"submitEntry",sheet:state.selectedSheet,empId:state.empData.empId,date:state.selectedDate,workType:state.workType,hours:hrs})
    .then(function(d){
      var msg=$("submitMsg");
      if(d.success){
        msg.className="submit-msg ok";
        msg.textContent="저장완료 | 환산: "+(d.converted>=0?"+":"")+d.converted+"h | 잔여: "+d.finalBalance+"h";
        show("submitMsg");
        refreshData();
        setTimeout(closeModal,1800);
      }else{
        msg.className="submit-msg err";msg.textContent="오류: "+(d.error||"저장 실패");show("submitMsg");
      }
    })
    .catch(function(){
      var msg=$("submitMsg");msg.className="submit-msg err";msg.textContent="서버 연결 실패";show("submitMsg");
    })
    .finally(function(){$("submitBtn").disabled=false;$("submitBtn").textContent="저장하기";});
}

function refreshData(){
  if(!state.empData)return;
  api({action:"enter",sheet:state.selectedSheet,empId:state.empData.empId,name:state.empData.name})
    .then(function(d){if(d.success){state.empData=d;renderDash();}})
    .catch(function(){});
}
</script>
</body>
</html>
